name: Release Windows

# During the NFL season, do not push v* tags Thursday through Monday (Eastern).
# That window is gameday. For a partial rollout, set repository variable
# SIDELINE_STAGING_PERCENTAGE to an integer 1-99. This workflow writes it into
# latest.yml; electron-updater then updates only that share of installs.
# Leave the variable unset for a full rollout.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Create one draft release before electron-builder uploads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" --json isDraft --jq .isDraft | grep -qx true; then
            echo "Draft $tag already exists; electron-builder will upload into it"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag is already published; electron-builder will not create another"
          else
            gh release create "$tag" --title "$version" --draft --verify-tag --notes "Sideline $version"
          fi
      - run: npm run build:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stamp stagingPercentage into latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SIDELINE_STAGING_PERCENTAGE: ${{ vars.SIDELINE_STAGING_PERCENTAGE }}
        run: node scripts/stamp-staging-percentage.mjs
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Verify exactly one release has the Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-assets.mjs
