appId: com.sideline.app
productName: Sideline
copyright: Copyright 2026 Kevin Etheridge
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!fixtures/*'
  - '!scripts/**/*'
  - '!.github/**/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{README.md,.gitignore}'
  - '!tv/**/*'
  - '!site/**/*'
extraResources:
  - from: fixtures
    to: fixtures
win:
  executableName: Sideline
  icon: build/icon.ico
  # Unsigned personal builds. Authenticode signing is an optional follow-up.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Stable name so /releases/latest/download/Sideline-Setup.exe keeps working.
  # electron-updater reads path and sha512 from latest.yml, not the filename.
  artifactName: Sideline-Setup.${ext}
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
mac:
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: ketheridge7
  repo: sideline
  releaseType: release
npmRebuild: false
# asar must stay on: onlyLoadAppFromAsar refuses an unpacked app directory.
asar: true
# Packaged binaries only. `npm start` and `electron-vite preview` are not fused.
# enableCookieEncryption is one-way: plaintext ESPN cookies already in persist:espn
# will not decrypt. Sign in to ESPN again after installing a fused build.
electronFuses:
  enableCookieEncryption: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
