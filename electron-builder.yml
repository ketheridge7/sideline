appId: com.sideline.app
productName: Sideline
copyright: Copyright 2026 Kevin Etheridge
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!fixtures/*'
  - '!scripts/**/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{README.md,.gitignore}'
  - '!tv/**/*'
extraResources:
  - from: fixtures
    to: fixtures
win:
  executableName: Sideline
  icon: build/icon.ico
  # Unsigned personal builds. Authenticode signing is an optional follow-up.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
mac:
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
