<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="SIDELINE">
  <!--
    Broadcast S mark (Kevin lock 2026-09-16 Option C):
    Two parallel thick slanted rounded bars forming an S.
    Lime gradient. No square field, no packaging stripe.
  -->
  <defs>
    <linearGradient id="broadcastLime" x1="24" y1="8" x2="104" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6F34A"/>
      <stop offset="50%" stop-color="#B6FF3B"/>
      <stop offset="100%" stop-color="#7DFFB0"/>
    </linearGradient>
  </defs>
  <!-- Top bar of S -->
  <rect x="22" y="18" width="72" height="28" rx="14" ry="14"
        fill="url(#broadcastLime)"
        transform="rotate(-32 58 32)"/>
  <!-- Bottom bar of S (mirrored offset) -->
  <rect x="34" y="82" width="72" height="28" rx="14" ry="14"
        fill="url(#broadcastLime)"
        transform="rotate(-32 70 96)"/>
</svg>
